 function profile(tab){const c=d.customers.find(x=>x.customer_id===state.selected);if(!c){dir();return}const a=stats(c);const rewards=d.rewards.filter(r=>r.customer_id===c.customer_id),coupons=d.coupons.filter(r=>r.customer_id===c.customer_id);const branch=d.branches.find(b=>b.branch_id===c.preferred_branch);const tabs=['Resumen','Wallet','Compras','Beneficios'];const facts=items=>`<div class="facts">${items.map(([k,n])=>`<div class="fact"><small>${esc(k)}</small><strong>${esc(n??'—')}</strong></div>`).join('')}</div>`;let content='';if(tab==='Resumen')content=`<h3>Información personal y comercial</h3>${facts([['Teléfono',c.phone||'Sin asignar'],['ID de lealtad',c.loyalty_id],['Sucursal habitual',branch?.name],['Canal preferido',c.preferred_channel],['Categoría favorita',c.favorite_category],['Consentimiento comercial',c.marketing_opt_in?'Activo':'Inactivo'],['Frecuencia habitual',a.frequency===null?'Sin histórico suficiente':a.frequency+' días']])}${btn('Editar perfil','editCustomer')}`;if(tab==='Wallet')content=a.wallet?`<div class="profile-card"><small>Saldo disponible</small><h2>${cash(a.wallet.available_balance,a.wallet.currency)}</h2>${facts([['Puntos acumulados',a.wallet.points],['Estado',a.wallet.status],['Wallet ID',a.wallet.wallet_id]])}${btn('Editar saldo','editWallet')}</div>`:'<p>Sin Wallet.</p>';if(tab==='Compras')content=`<header><h3>Histórico de compras</h3>${btn('Agregar compra','addPurchase','secondary')}</header><div class="table"><table><thead><tr><th>Fecha</th><th>Productos</th><th>Canal</th><th>Total</th><th></th></tr></thead><tbody>${a.ts.map(t=>`<tr><td>${esc(t.date.slice(0,10))}</td><td>${esc((t.items||[]).map(i=>(d.products.find(p=>p.product_id===i.product_id)?.name||i.product_id)+' ×'+i.quantity).join(', '))}</td><td>${esc(t.channel)}</td><td>${cash(t.total,t.currency)}</td><td><button class="secondary mini" data-tx="${esc(t.transaction_id)}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;if(tab==='Beneficios')content=`<h3>Re  v.innerHTML=`<div class="actions">${btn('← Todos los clientes','backDirectory','secondary')}</div><section><div class="profile-head"><span class="avatar">${initials(c)}</span><div class="grow"><h2>${esc(c.first_name+' '+c.last_name)}</h2><p class="muted">${esc(c.customer_id)} · ${esc(d.config.loyalty_program)}</p></div><span class="pill">${a.segment}</span></div><div class="directory-metrics">${[['Saldo disponible',cash(a.wallet?.available_balance||0)],['Última compra',a.days===null?'—':a.days+' días'],['Ticket promedio',cash(a.ticket)],['Compras históricas',a.ts.length]].map(([k,n])=>`<div class="metric">${k}<b>${esc(n)}</b></div>`).join('')}</div><div class="profile-tabs">${tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>${content}</section><div id="profileEditor"></div>`;
 bind('backDirectory',dir);v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>profile(b.dataset.tab));
 function edit(key,r,fields,isNew=false){const idKey=entities[key];const id=r[idKey];$('profileEditor').innerHTML=`<section><h2>${isNew?'Agregar':'Editar'} registro</h2><div class="grid">${fields.map(([k,l,type,opts],i)=>`<div><label>${esc(l)}</label>${type==='select'?`<select id="pf${i}">${opts.map(([val,name])=>`<option value="${esc(val)}" ${String(r[k])===String(val)?'selected':''}>${esc(name)}</option>`).join('')}</select>`:type==='json'?`<textarea id="pf${i}" rows="4">${esc(pretty(r[k]))}</textarea>`:`<input id="pf${i}" type="${type||'text'}" ${type==='number'?'step="any"':''} value="${esc(type==='date'?String(r[k]||'').slice(0,10):r[k]??'')}">`}</div>`).join('')}</div><div class="actions">${btn('Guardar cambios','saveProfile')}${btn('Cancelar','cancelProfile','secondary')}</div></section>`;bind('cancelProfile',()=>{$('profileEditor').innerHTML=''});bind('saveProfile',async()=>{const next={...r};fields.forEach(([k,l,type],i)=>{const val=$('pf'+i).value;next[k]=type==='number'?Number(val):type==='json'?JSON.parse(val):type==='date'?new Date(val+'T12:00:00Z').toISOString():k==='marketing_opt_in'?val==='true':val||null;if(type==='number'&&(val===''||!Number.isFinite(next[k])||next[k]<0))throw Error('Valor inválido: '+l)});if(key==='transactions'){if(!Array.isArray(next.items)||!next.items.length||next.items.some(i=>!d.products.some(p=>p.product_id===i.product_id)||!Number.isInteger(i.quantity)||i.quantity<=0||!Number.isFinite(i.unit_price)||i.unit_price<0))throw Error('Artículos inválidos');next.total=next.items.reduce((a,i)=>a+i.quantity*i.unit_price,0)}if(key==='rewards'&&(!Number.isInteger(next.current_progress)||!Number.isInteger(next.required_progress)||next.required_progress<1||next.current_progress>next.required_progress))throw Error('Progreso inválido');const fresh=await api('exportDataset');const idx=fresh[key].findIndex(x=>x[idKey]===id);if(isNew){if(idx>=0)throw Error('ID duplicado');fresh[key].push(next)}else{if(idx<0)throw Error('Registro no encontrado');fresh[key][idx]=next}validate(fresh);await api('importDataset',{dataset:fresh});state.data=await api('exportDataset');render();notice('Cambios guardados en Google Sheets.');});$('profileEditor').scrollIntoView({behavior:'smooth'});}
 const branchOpts=d.branches.map(b=>[b.branch_id,b.name]);bind('editCustomer',()=>edit('customers',c,[['first_name','Nombre'],['last_name','Apellido'],['phone','Teléfono','tel'],['marketing_opt_in','Consentimiento','select',[['true','Activo'],['false','Inactivo']]],['preferred_branch','Sucursal','select',branchOpts],['preferred_channel','Canal','select',[['physical_store','Tienda física'],['web','E-commerce'],['app','App']]],['favorite_category','Categoría favorita']]));if(a.wallet)bind('editWallet',()=>edit('wallets',a.wallet,[['available_balance','Saldo disponible','number'],['points','Puntos','number'],['status','Estado','select',[['active','Activo'],['inactive','Inactivo']]]]));const txFields=[['date','Fecha','date'],['channel','Canal','select',[['physical_store','Tienda física'],['web','E-commerce'],['app','App']]],['branch_id','Sucursal','select',branchOpts],['items','Artículos (product_id, quantity, unit_price)','json']];v.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>edit('transactions',a.ts.find(t=>t.transaction_id===b.dataset.tx),txFields));bind('addPurchase',()=>{const p=d.products[0];if(!p)throw Error('Carga productos primero');edit('transactions',{transaction_id:'TRX-'+crypto.randomUUID(),customer_id:c.customer_id,date:new Date().toISOString(),channel:'physical_store',branch_id:c.preferred_branch,currency:d.config.currency,items:[{product_id:p.product_id,quantity:1,unit_price:p.price}],total:p.price},txFields,true)});v.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>edit('rewards',rewards.find(r=>r.reward_id===b.dataset.reward),[['name','Nombre'],['current_progress','Progreso','number'],['required_progress','Meta','number'],['status','Estado','select',[['in_progress','En progreso'],['unlocked','Disponible'],['redeemed','Redimida']]]]));const couponFields=[['code','Código'],['discount_type','Tipo','select',[['percentage','Porcentaje'],['fixed','Monto fijo']]],['value','Valor','number'],['status','Estado','select',[['available','Disponible'],['redeemed','Redimido'],['expired','Vencido']]]];v.querySelectorAll('[data-coupon]').forEach(b=>b.onclick=()=>edit('coupons',coupons.find(r=>r.coupon_id===b.dataset.coupon),couponFields));bind('addCoupon',()=>edit('coupons',{coupon_id:'CPN-'+crypto.randomUUID(),customer_id:c.customer_id,code:'CLUB20',discount_type:'percentage',value:20,status:'available'},couponFields,true));
 }
 if(state.selected&&d.customers.some(c=>c.customer_id===state.selected))profile('Resumen');else dir();return;

const key=Object.keys(labels).find(k=>labels[k]===p);if(key){const rows=state.data?.[key]||[];const idKey=entities[key];const customer=key==='customers';const actions={customers:'getCustomer',transactions:'getTransactions',wallets:'getWallet',rewards:'getRewards',coupons:'getCoupons',products:'getProducts',inventory:'getStock',promotions:'getPromotions',branches:'getBranches',audiences:'getAudiences'};
const titles={customer_id:'Cliente',first_name:'Nombre',last_name:'Apellido',phone:'Teléfono',marketing_opt_in:'Consentimiento',preferred_branch:'Sucursal habitual',loyalty_id:'ID lealtad',available_balance:'Saldo',current_progress:'Progreso',required_progress:'Meta',available_quantity:'Unidades',date:'Fecha',total:'Importe',status:'Estado',name:'Nombre',currency:'Moneda',channel:'Canal'};
const show=x=>typeof x==='object'&&x!==null?JSON.stringify(x):x===true?'Sí':x===false?'No':x??'—';
function listing(rs){const cols=[...new Set(rows.flatMap(Object.keys))];return `<div class="table"><table><thead><tr>${cols.map(k=>`<th>${esc(titles[k]||k)}</th>`).join('')}<th>Acciones</th></tr></thead><tbody>${rs.map(r=>`<tr>${cols.map(k=>`<td title="${esc(show(r[k]))}">${esc(show(r[k]))}</td>`).join('')}<td><button class="secondary mini" data-edit="${esc(r[idKey])}">Editar</button> ${customer?`<button class="secondary mini" data-profile="${esc(r[idKey])}">Ver perfil</button>`:''} ${actions[key]?`<button class="secondary mini" data-api="${esc(r[idKey])}">API</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function wire(){v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(rows.find(r=>r[idKey]===b.dataset.edit)));v.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(rows.find(r=>r[idKey]===b.dataset.profile)));v.querySelectorAll('[data-api]').forEach(b=>b.onclick=()=>{const r=rows.find(r=>r[idKey]===b.dataset.api);const c=state.data.customers.find(c=>c.customer_id===r.customer_id);const fields=c?(c.phone?{phone:c.phone}:{customer_id:c.customer_id}):key==='inventory'?{product_id:r.product_id,branch_id:r.branch_id}:key==='products'?{product_id:r.product_id}:{};state.apiPreset={action:actions[key],fields};go('API Playground')})}
function editor(r){if(!r)return;const fields=Object.keys(r);$('detail').innerHTML=`<section><h2>Editar ${esc(r[idKey])}</h2><p class="muted">Actualización manual del sistema de origen.</p><div class="grid">${fields.map((k,i)=>`<div><label>${esc(titles[k]||k)}</label>${typeof r[k]==='boolean'?`<select id="f${i}"><option value="true" ${r[k]?'selected':''}>Sí</option><option value="false" ${!r[k]?'selected':''}>No</option></select>`:r[k]!==null&&typeof r[k]==='object'?`<textarea id="f${i}" rows="3">${esc(pretty(r[k]))}</textarea>`:`<input id="f${i}" ${k===idKey?'readonly':''} type="${typeof r[k]==='number'?'number':'text'}" ${typeof r[k]==='number'?'step="any"':''} value="${esc(r[k]??'')}">`}</div>`).join('')}</div><div class="actions">${btn('Guardar cambios','saveRecord')}${btn('Cancelar','cancelRecord','secondary')}</div></section>`;bind('cancelRecord',()=>{$('detail').innerHTML=''});bind('saveRecord',async()=>{const next={...r};fields.forEach((k,i)=>{const x=$('f'+i).value;next[k]=typeof r[k]==='boolean'?x==='true':typeof r[k]==='number'?(x.trim()===''?NaN:Number(x)):r[k]!==null&&typeof r[k]==='object'?JSON.parse(x):x||null;if(typeof next[k]==='number'&&!Number.isFinite(next[k]))throw Error('Número inválido: '+k)});const d=structuredClone(await api('exportDataset'));const idx=d[key].findIndex(x=>x[idKey]===r[idKey]);if(idx<0)throw Error('Registro no encontrado');d[key][idx]=next;validate(d);await api('importDataset',{dataset:d});await load();notice('Registro actualizado en CRM. Las APIs ya consultan los nuevos datos.')});$('detail').scrollIntoView({behavior:'smooth'})}
function profile(c){const d=state.data;const w=d.wallets.find(w=>w.customer_id===c.customer_id);const ts=d.transactions.filter(t=>t.customer_id===c.customer_id).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));const days=ts.length?Math.max(0,Math.floor((Date.now()-Date.parse(ts[0].date))/86400000)):'—';$('detail').innerHTML=`<section><h2>${esc(c.first_name+' '+c.last_name)}</h2><p>${esc(c.customer_id)} · ${esc(c.phone||'Sin teléfono')} · ${esc(c.loyalty_id||'')}</p><div class="grid">${[['Saldo Wallet',w?`${w.available_balance} ${w.currency}`:'—'],['Última compra',days+' días'],['Compras registradas',ts.length]].map(([k,n])=>`<div class="metric">${k}<b>${esc(n)}</b></div>`).join('')}</div><div class="actions">${btn('Editar perfil','editProfile')}${btn('Consultar API por teléfono','profileApi','secondary')}</div>${[['Recompensas',d.rewards],['Cupones',d.coupons],['Histórico de compras',ts]].map(([k,a])=>`<h2>${k}</h2>${table(a.filter(r=>r.customer_id===c.customer_id))}`).join('')}</section>`;bind('editProfile',()=>editor(c));bind('profileApi',()=>{state.apiPreset={action:'getCustomer',fields:c.phone?{phone:c.phone}:{customer_id:c.customer_id}};go('API Playground')});$('detail').scrollIntoView({behavior:'smooth'})}
v.innerHTML=`<section><h2>${esc(p)} <span class="tag">${rows.length} registros</span></h2><div class="actions">${btn('Actualizar','refresh','secondary')}</div><input id="search" placeholder="Buscar registros"><div id="records">${listing(rows)}</div></section><div id="detail"></div>`;$('search').oninput=()=>{$('records').innerHTML=listing(rows.filter(r=>JSON.stringify(r).toLowerCase().includes($('search').value.toLowerCase())));wire()};bind('refresh',load);wire();return}}
