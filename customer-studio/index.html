<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Demo Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#242238;font:14px system-ui,sans-serif}aside{background:#211638;color:white;padding:25px 18px;position:fixed;width:235px;inset:0 auto 0 0;overflow:auto}aside h2{font-size:19px;margin:0 0 5px}aside small{color:#b7a9d0}nav{margin-top:30px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#d8d0e5;border:0;padding:11px 12px;margin:3px 0;border-radius:7px}nav button.active,nav button:hover{background:#513980;color:white}main{margin-left:235px;padding:30px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:29px;margin:0 0 6px}h2{font-size:19px}p{line-height:1.5}small,.muted{color:#716b83}section,.panel{background:white;border:1px solid #e3dfeb;border-radius:12px;padding:20px;margin:16px 0}label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #d7d2e2;border-radius:7px;background:white;color:inherit;font:inherit}button{cursor:pointer;border:0;background:#6842ad;color:white;border-radius:7px;padding:10px 15px;font:inherit;font-weight:600}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#eee9f6;color:#503581}button.danger{background:#fce8e9;color:#a32c40}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.metric{padding:18px;border:1px solid #e6e0ef;border-radius:10px;background:white}.metric b{display:block;font-size:27px;color:#6945a9;margin-top:8px}.table{overflow:auto;max-height:510px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:11px;border-bottom:1px solid #ece9f1;text-align:left;max-width:340px;overflow:hidden;text-overflow:ellipsis}th{background:#f6f3fa;position:sticky;top:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#211638;color:#e4d9ff;padding:16px;border-radius:8px;max-height:460px;overflow:auto;font-size:12px}#notice{white-space:pre-wrap;padding:12px;border-radius:7px;margin:12px 0;background:#e9e0fa}#notice:empty{display:none}#notice.err{background:#ffe5e7;color:#8b2036}.tag{background:#eee8f8;color:#62439c;padding:5px 9px;border-radius:20px;font-size:12px} @media(max-width:720px){aside{position:static;width:auto}nav{display:flex;flex-wrap:wrap;margin-top:12px}nav button{width:auto}main{margin:0;padding:16px}header{align-items:flex-start;flex-direction:column}}
</style></head><body><aside><h2>Universal Demo Studio</h2><small>Presales · Sandbox</small><nav id="nav"></nav></aside><main><header><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div><span class="tag" id="active">Sin demo seleccionada</span></header><div id="notice" role="status"></div><div id="view"></div></main><script>
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbzC6uyXXj986BtbkYH0E6teRoK3WQEur4hwR-7VTu3FjN2SuzO9EPq0oP8cqjqYemQd/exec';
const entities={customers:'customer_id',transactions:'transaction_id',wallets:'wallet_id',rewards:'reward_id',coupons:'coupon_id',products:'product_id',inventory:'inventory_id',promotions:'promotion_id',branches:'branch_id',stock_subscriptions:'subscription_id',audiences:'audience_id'};
const labels={customers:'Clientes',transactions:'Transacciones',wallets:'Wallet',rewards:'Recompensas',coupons:'Cupones',products:'Productos',inventory:'Inventario',promotions:'Promociones',branches:'Sucursales',stock_subscriptions:'Alertas de stock',audiences:'Audiencias'};
const state={page:'Dashboard',url:ENDPOINT,admin:'',token:'',id:'',data:null,demos:[],logs:[],selected:null,upload:null};
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>JSON.stringify(x,null,2);const notice=(s,err=false)=>{$('notice').textContent=s;$('notice').className=err?'err':''};
function download(name,obj){const u=URL.createObjectURL(new Blob([pretty(obj)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function api(action,fields={},admin=false){const token=admin?state.admin:(state.token||state.admin);if(!token)throw Error('Introduce un token en Configuración.');const body={action,...(!admin?{demo_id:state.id}:{}),...fields,token};const clean={...body,token:'[REDACTED]'};const log={date:new Date().toISOString(),request:clean};state.logs.unshift(log);try{const r=await fetch(state.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body),redirect:'follow',credentials:'omit'});const raw=await r.text();let v;try{v=JSON.parse(raw)}catch{throw Error('La respuesta no es JSON. Revisa el deployment. HTTP '+r.status)}log.response=action==='createDemo'&&v.data?{...v,data:{...v.data,token:'[REDACTED]'}}:v;if(!v.ok)throw Error(v.error||'API error');return v.data}catch(e){log.error=e.message;throw e}}
async function run(fn){notice('');document.querySelectorAll('main button').forEach(b=>b.disabled=true);try{await fn()}catch(e){notice(e.message,true)}finally{document.querySelectorAll('main button').forEach(b=>b.disabled=false)}}
function btn(text,id,cls=''){return `<button id="${id}" class="${cls}">${text}</button>`}function bind(id,fn){if($(id))$(id).onclick=()=>run(fn)}function go(page){state.page=page;notice('');render()}function requireDemo(){if(!state.id)throw Error('Selecciona una demo primero.')}async function load(){requireDemo();state.data=await api('exportDataset');render()}
function table(rows){if(!rows?.length)return '<p class="muted">Sin registros.</p>';const keys=[...new Set(rows.flatMap(Object.keys))];return `<div class="table"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td title="${esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}">${esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function baseDataset(){const d={schema_version:'1.0',config:{id:'CONFIG',company_name:'Demo Company',industry:'retail',currency:'MXN',loyalty_program:'Loyalty Club',logo_url:'',primary_color:'#6842ad'}};Object.keys(entities).forEach(k=>d[k]=[]);const date=n=>new Date(Date.now()-n*86400000).toISOString();d.branches=[{branch_id:'BR-001',name:'Central Store',address:'Demo address',hours:'09:00-20:00'}];d.products=[{product_id:'SKU-001',name:'Daily Care Kit',category:'personal_care',price:350,currency:'MXN',image_url:'',product_url:''},{product_id:'SKU-002',name:'Reusable Bottle',category:'lifestyle',price:500,currency:'MXN'}];['Ana','Carlos','Lucia','Daniel','Sofia'].forEach((n,i)=>{const id='CUS-00'+(i+1);d.customers.push({customer_id:id,first_name:n,last_name:'Demo',phone:null,marketing_opt_in:true,preferred_branch:'BR-001',loyalty_id:'LOY-00'+(i+1)});d.wallets.push({wallet_id:'WAL-00'+(i+1),customer_id:id,available_balance:[180,0,75,250,100,0][i],currency:'MXN',status:'active'});d.rewards.push({reward_id:'REW-00'+(i+1),customer_id:id,name:'4+1 Reward',current_progress:i%5,required_progress:4,status:i%5===4?'unlocked':'in_progress'});for(let j=0;j<4;j++)d.transactions.push({transaction_id:`TRX-${i+1}-${j+1}`,customer_id:id,date:date([50,27,5,75,15,35][i]+j*30),channel:j%2?'web':'physical_store',branch_id:'BR-001',total:350,currency:'MXN',items:[{product_id:'SKU-001',quantity:1,unit_price:350}]})});d.inventory=[{inventory_id:'INV-001',product_id:'SKU-001',branch_id:'BR-001',available_quantity:0},{inventory_id:'INV-002',product_id:'SKU-002',branch_id:'BR-001',available_quantity:25}];d.coupons=[{coupon_id:'CPN-001',customer_id:'CUS-001',code:'DEMO10',discount_type:'percentage',value:10,status:'available'}];d.promotions=[{promotion_id:'PRO-001',name:'Lifestyle offer',category:'lifestyle',discount_type:'percentage',value:10,status:'active'}];d.stock_subscriptions=[{subscription_id:'SUB-001',customer_id:'CUS-001',product_id:'SKU-001',branch_id:'BR-001',status:'pending'}];d.audiences=[{audience_id:'AUD-001',name:'Inactive customers',rule:{field:'days_since_last_purchase',operator:'gte',value:45}},{audience_id:'AUD-002',name:'Wallet available',rule:{field:'available_balance',operator:'gt',value:0}}];return d}
function validate(d){if(d?.schema_version!=='1.0'||!d.config?.company_name||!d.config?.currency)throw Error('Dataset inválido: config o schema_version.');for(const [k,id] of Object.entries(entities)){if(!Array.isArray(d[k]))throw Error('Falta array '+k);const seen=new Set();for(const r of d[k]){if(typeof r[id]!=='string'||!r[id]||seen.has(r[id]))throw Error('ID inválido o duplicado: '+k);seen.add(r[id])}}return d}
const pages=['Dashboard','Nueva demo','Demo Users','Import / Export',...Object.values(labels),'API Playground','Request Logs','Configuración'];
function render(){ $('nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${p===state.page?'active':''}">${esc(p)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(pages[Number(b.dataset.page)]));$('title').textContent=state.page;$('subtitle').textContent='Customer · Loyalty · Commerce';$('active').textContent=state.data?.config?.company_name||state.id||'Sin demo seleccionada';const v=$('view');const p=state.page;
if(p==='Configuración'){v.innerHTML=`<section><h2>Conexión</h2><label>Apps Script URL</label><input id="url" value="${esc(state.url)}"><label>Admin token (solo en memoria)</label><input id="admin" type="password" autocomplete="off" value="${esc(state.admin)}"><label>Demo ID (opcional)</label><input id="did" value="${esc(state.id)}"><label>Demo token (opcional)</label><input id="dt" type="password" autocomplete="off" value="${esc(state.token)}"><div class="actions">${btn('Guardar sesión','save')}${btn('Probar conexión','test','secondary')}${btn('Cerrar sesión','logout','secondary')}</div><p class="muted">Los tokens no se guardan en GitHub ni en almacenamiento local. Al recargar la página se pierden.</p></section>`;function save(){const u=new URL($('url').value);if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!u.pathname.endsWith('/exec'))throw Error('Usa una URL HTTPS de Apps Script /exec.');if(state.url!==u.href){state.data=null;state.demos=[]}state.url=u.href;state.admin=$('admin').value.trim();if(state.id!==$('did').value.trim())state.data=null;state.id=$('did').value.trim();state.token=$('dt').value.trim()};bind('save',()=>{save();notice('Configuración guardada en esta sesión.')});bind('test',async()=>{save();if(state.admin){state.demos=await api('listDemos',{},true);notice('Conexión correcta. '+state.demos.length+' demos disponibles.')}else{await load();notice('Conexión correcta.')}});bind('logout',()=>{state.admin=state.token=state.id='';state.data=null;state.demos=[];state.logs=[];render()});return}
if(p==='Dashboard'){v.innerHTML=`<div class="grid">${[['Clientes',state.data?.customers.length],['Transacciones',state.data?.transactions.length],['Wallets',state.data?.wallets.length],['Productos',state.data?.products.length]].map(([l,n])=>`<div class="metric">${l}<b>${n??'—'}</b></div>`).join('')}</div><section><h2>Demos disponibles</h2><div class="actions">${btn('Actualizar listado','list')}${btn('Nueva demo','new','secondary')}${btn('Cargar demo actual','load','secondary')}${btn('Configurar conexión','cfg','secondary')}</div><div class="table"><table><thead><tr><th>Compañía</th><th>Industria</th><th>Moneda</th><th></th></tr></thead><tbody>${state.demos.map((d,i)=>`<tr><td>${esc(d.company_name)}</td><td>${esc(d.industry)}</td><td>${esc(d.currency)}</td><td><button data-open="${i}">Abrir</button></td></tr>`).join('')}</tbody></table></div></section>`;bind('list',async()=>{state.demos=await api('listDemos',{},true);render()});bind('new',()=>go('Nueva demo'));bind('cfg',()=>go('Configuración'));bind('load',load);v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>run(async()=>{state.id=state.demos[Number(b.dataset.open)].demo_id;state.token='';await load()}));return}
if(p==='Nueva demo'){v.innerHTML=`<section><h2>Crear demo independiente</h2><label>Compañía</label><input id="company" placeholder="Farmacias YZA"><label>Industria</label><input id="industry" value="retail"><label>Moneda</label><input id="currency" value="MXN"><label>Programa de lealtad</label><input id="loyalty" value="Loyalty Club"><label>Owner (opcional)</label><input id="owner"><label>Dataset personalizado (opcional)</label><input id="file" type="file" accept=".json,application/json"><p class="muted">Si no subes un archivo, se copia DEFAULT de Google Sheets.</p><div class="actions">${btn('Crear demo','create')}${btn('Descargar ejemplo completo','default','secondary')}</div></section>`;bind('default',()=>download('demo-default.json',baseDataset()));bind('create',async()=>{const company=$('company').value.trim();if(!company)throw Error('Escribe el nombre de la compañía.');const config={company_name:company,industry:$('industry').value.trim(),currency:$('currency').value.trim(),loyalty_program:$('loyalty').value.trim()};const f=$('file').files[0];let dataset=f?validate(JSON.parse(await f.text())):undefined;const r=await api('createDemo',{config,owner:$('owner').value,...(dataset?{dataset}:{})},true);state.id=r.demo_id;state.token=r.token;state.data=null;go('Configuración');notice('Demo creada. Guarda su Demo ID y Demo token de forma segura antes de cerrar esta sesión.');});return}
if(p==='Import / Export'){v.innerHTML=`<section><h2>Dataset</h2><div class="actions">${btn('Descargar ejemplo','default','secondary')}${btn('Exportar demo actual','export')}${btn('Restaurar ejemplo','restore','danger')}</div><label>Importar JSON personalizado</label><input id="file" type="file" accept=".json,application/json"><div class="actions">${btn('Validar archivo','validate','secondary')}${btn('Reemplazar dataset actual','import','danger')}</div><pre id="preview">Selecciona un archivo para validar.</pre></section>`;bind('default',()=>download('demo-default.json',baseDataset()));bind('export',async()=>{requireDemo();download(state.id+'.json',await api('exportDataset'))});bind('validate',async()=>{const f=$('file').files[0];if(!f)throw Error('Selecciona un archivo.');const d=validate(JSON.parse(await f.text()));$('preview').textContent=pretty(Object.fromEntries(Object.keys(entities).map(k=>[k,d[k].length])))});bind('import',async()=>{requireDemo();const f=$('file').files[0];if(!f)throw Error('Selecciona un archivo.');const d=validate(JSON.parse(await f.text()));if(!confirm('¿Reemplazar todos los datos de esta demo?'))return;await api('importDataset',{dataset:d});await load();notice('Dataset importado.')});bind('restore',async()=>{requireDemo();if(!confirm('¿Reemplazar todos los registros por datos de ejemplo?'))return;const d=baseDataset();if(state.data)d.config={...d.config,...state.data.config};await api('importDataset',{dataset:d});await load();notice('Dataset restaurado.')});return}
if(p==='Demo Users'){const customers=state.data?.customers||[];const assigned=customers.filter(c=>c.phone);const slots=assigned.slice(0,5);while(slots.length<5){const next=customers.find(c=>!slots.some(s=>s&&s.customer_id===c.customer_id));slots.push(next||null);if(!next)break;}while(slots.length<5)slots.push(null);v.innerHTML=`<section><h2>Números de prueba</h2><p>Asigna hasta cinco teléfonos autorizados a perfiles existentes. Los demás datos no cambian. Los campos vacíos eliminan la asignación anterior.</p><div class="actions">${btn('Cargar / actualizar demo','phonesLoad','secondary')}</div>${slots.map((c,i)=>`<div class="grid"><div><label>Perfil ${i+1}</label><select id="profile${i}"><option value="">Sin perfil</option>${customers.map(x=>`<option value="${esc(x.customer_id)}" ${c?.customer_id===x.customer_id?'selected':''}>${esc(x.customer_id+' · '+x.first_name+' '+(x.last_name||''))}</option>`).join('')}</select></div><div><label>Teléfono ${i+1}</label><input id="phone${i}" type="tel" placeholder="5255XXXXXXXX" value="${esc(c?.phone||'')}"></div></div>`).join('')}<div class="actions">${btn('Guardar teléfonos','phonesSave')}</div><p class="muted">Usa el código de país. No se envían mensajes. Los perfiles sin número se conservan.</p></section>`;bind('phonesLoad',load);bind('phonesSave',async()=>{requireDemo();if(!state.data)throw Error('Carga la demo primero.');const assignments=[];for(let i=0;i<5;i++){const customer_id=$('profile'+i).value,phone=$('phone'+i).value.trim();if(phone){if(!customer_id)throw Error('Selecciona un perfil para cada teléfono.');assignments.push({customer_id,phone});}}await api('setDemoPhones',{assignments});await load();notice('Teléfonos guardados. Ya puedes consultar por phone.');});return}
if(p==='API Playground'){const actions=['getCustomer','getCustomers','getWallet','getRewards','getCoupons','getTransactions','getProducts','getStock','getBranches','getPromotions','getAudiences','exportDataset'];v.innerHTML=`<section><label>Action</label><select id="action">${actions.map(a=>`<option>${a}</option>`).join('')}</select><label>Parámetros adicionales JSON</label><textarea id="params" rows="5">{"phone":"5255XXXXXXXX"}</textarea><div class="actions">${btn('Ejecutar API','execute')}${btn('Copiar request','copy','secondary')}</div><h2>Request</h2><pre id="req">—</pre><h2>Response</h2><pre id="res">—</pre></section>`;const preset=()=>{const a=$('action').value;const c=state.data?.customers.find(c=>c.phone);$('params').value=pretty(['getCustomer','getWallet','getRewards','getCoupons','getTransactions'].includes(a)?(c?{phone:c.phone}:{phone:'5255XXXXXXXX'}):{});};$('action').onchange=preset;preset();function request(){const fields=JSON.parse($('params').value||'{}');if(!fields||Array.isArray(fields)||typeof fields!=='object'||['action','token','demo_id'].some(k=>k in fields))throw Error('Parámetros inválidos o reservados.');return fields}bind('execute',async()=>{requireDemo();const fields=request(),a=$('action').value;$('req').textContent=pretty({action:a,demo_id:state.id,token:'YOUR_DEMO_TOKEN',...fields});try{$('res').textContent=pretty({ok:true,data:await api(a,fields)})}catch(e){$('res').textContent=e.message;throw e}});bind('copy',async()=>{await navigator.clipboard.writeText(pretty({action:$('action').value,demo_id:state.id,token:'YOUR_DEMO_TOKEN',...request()}));notice('Request copiado sin credenciales.')});return}
if(p==='Request Logs'){v.innerHTML=`<section><h2>Requests de esta sesión</h2>${btn('Descargar logs','logs','secondary')}<pre>${esc(pretty(state.logs))}</pre></section>`;bind('logs',()=>download('request-logs.json',state.logs));return}
const key=Object.keys(labels).find(k=>labels[k]===p);if(key){let rows=state.data?.[key]||[];v.innerHTML=`<section><h2>${esc(p)} <span class="tag">${rows.length} registros</span></h2><div class="actions">${btn('Actualizar','refresh','secondary')}${btn('Consultar API','play','secondary')}</div><input id="search" placeholder="Buscar registros"><div id="records">${table(rows)}</div></section><section><h2>Editar registros de esta entidad</h2><p class="muted">Edición de sandbox: guarda la colección completa mediante importDataset. No dispara eventos ni actualiza otras entidades automáticamente.</p><textarea id="edit" rows="12" spellcheck="false">${esc(pretty(rows))}</textarea><div class="actions">${btn('Guardar cambios','editSave','danger')}</div></section>`;$('search').oninput=()=>{$('records').innerHTML=table(rows.filter(r=>JSON.stringify(r).toLowerCase().includes($('search').value.toLowerCase())))};bind('refresh',load);bind('play',()=>go('API Playground'));bind('editSave',async()=>{requireDemo();if(!state.data)throw Error('Carga los datos primero.');const d=structuredClone(state.data);d[key]=JSON.parse($('edit').value);validate(d);if(!confirm('¿Guardar cambios en esta demo? No genera eventos.'))return;await api('importDataset',{dataset:d});await load();notice('Cambios guardados.')});return}}
render();
</script></body></html>
